<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undertale Battle Simulator</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* La caja de batalla clásica de Undertale */
        canvas {
            border: 4px solid #fff;
            background-color: #000;
        }
        h1 { margin: 5px; font-size: 18px; letter-spacing: 2px; }
        p { font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <h1>BAD TIME SIMULATOR</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Muévete con las flechas del teclado o W, A, S, D</p>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Configuración del Corazón (Jugador)
    const player = {
        x: canvas.width / 2 - 8,
        y: canvas.height / 2 - 8,
        size: 16,
        speed: 4
    };

    // Control de teclas presionadas
    const keys = {};

    window.addEventListener("keydown", (e) => {
        keys[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
        keys[e.key] = false;
    });

    // Bucle principal del juego (60 cuadros por segundo)
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Lógica de movimiento y colisiones con los bordes
    function update() {
        if (keys["ArrowUp"] || keys["w"] || keys["W"]) player.y -= player.speed;
        if (keys["ArrowDown"] || keys["s"] || keys["S"]) player.y += player.speed;
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed;
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed;

        // Evitar que el corazón se salga del recuadro blanco
        if (player.x < 0) player.x = 0;
        if (player.y < 0) player.y = 0;
        if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
        if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;
    }

    // Dibujar el corazón de Undertale
    function drawPlayer(x, y, size) {
        ctx.fillStyle = "#ff0000"; // Rojo Undertale
        ctx.beginPath();
        // Dibujo aproximado de un corazón usando arcos y líneas
        ctx.moveTo(x + size / 2, y + size / 4);
        ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + size / 2);
        ctx.bezierCurveTo(x, y + (size * 3) / 4, x + size / 2, y + size, x + size / 2, y + size);
        ctx.bezierCurveTo(x + size / 2, y + size, x + size, y + (size * 3) / 4, x + size, y + size / 2);
        ctx.bezierCurveTo(x + size, y, x + size / 2, y, x + size / 2, y + size / 4);
        ctx.closePath();
        ctx.fill();
    }

    // Renderizar la pantalla
    function draw() {
        // Limpiar lienzo anterior
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar el corazón en su posición actual
        drawPlayer(player.x, player.y, player.size);
    }

    // Arrancar el motor del juego
    gameLoop();
</script>
</body>
</html>
